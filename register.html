<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register Page</title>



<!----stylesheetlink-->
<link href="css/style.css" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->

    <link href="css/bootstrap.min.css"
        rel="stylesheet">




    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="css/bootstrap-icons.css">

</head>

<body class="bg-light">




<!-- ========================= -->
<!-- Register Section Start -->
<!-- ========================= -->

<section class="min-vh-100 d-flex align-items-center py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6 col-md-8 col-sm-10">






                <!-- Card Start -->

                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">








                    <!-- Top Header -->

                    <div class="bg-success text-center py-4 rounded-top-4">




                        <!-- Logo -->

                        <img src="images/logo.png"
                            alt="Logo"
                            width="220">






                        <!-- Heading -->

                        <h1 class="fw-bold text-white mt-3">

                            Create Account

                        </h1>






                        <!-- Paragraph -->

                        <p class="text-light mb-0">

                            Register your Fresh Grocery account

                        </p>

                    </div>










                    <!-- Card Body -->

                    <div class="card-body p-4 p-lg-5">








                        <!-- Form Start -->

                        <form id="registerForm">







                            <!-- Full Name -->

                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    Full Name

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-success text-white">

                                        <i class="bi bi-person-fill"></i>

                                    </span>

                                    <input type="text" id="fullname"
                                        class="form-control form-control-lg"
                                        placeholder="Enter your full name">

                                </div>

                            </div>









                            <!-- Email -->

                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    Email Address

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-success text-white">

                                        <i class="bi bi-envelope-fill"></i>

                                    </span>

                                    <input type="email" id="emails"
                                        class="form-control form-control-lg"
                                        placeholder="Enter your email">

                                </div>

                            </div>










                            <!-- Phone -->

                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    Phone Number

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-success text-white">

                                        <i class="bi bi-telephone-fill"></i>

                                    </span>

                                    <input type="text" id="phoneno"
                                        class="form-control form-control-lg"
                                        placeholder="Enter your phone number">

                                </div>

                            </div>










                            <!-- Password -->

                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    Password

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-success text-white">

                                        <i class="bi bi-lock-fill"></i>

                                    </span>

                                    <input type="password" id="createpassword"
                                        class="form-control form-control-lg"
                                        placeholder="Create password">

                                </div>

                            </div>










                            <!-- Confirm Password -->

                            <div class="mb-4">

                                <label class="form-label fw-bold">

                                    Confirm Password

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-success text-white">

                                        <i class="bi bi-shield-lock-fill"></i>

                                    </span>

                                    <input type="password" id="confrompassword"
                                        class="form-control form-control-lg"
                                        placeholder="Confirm password">

                                </div>

                            </div>










                            <!-- Register Button -->

                            <div class="d-grid mb-4">

                                <button class="btn btn-success btn-lg fw-bold">

                                    Register Now

                                </button>

                            </div>










                            <!-- Login Link -->

                            <div class="text-center">

                                <p class="mb-0">

                                    Already have an account?

                                    <a href="#"
                                        class="text-success fw-bold text-decoration-none">

                                        Login

                                    </a>

                                </p>

                            </div>

                        </form>

                        <!-- Form End -->

                    </div>

                </div>

                <!-- Card End -->

            </div>

        </div>

    </div>

</section>

<!-- ========================= -->
<!-- Register Section End -->
<!-- ========================= -->









<!-- Bootstrap JS -->

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>

</body>

</html>
